# Конфигурация моста ICQ (OSCAR) <-> Telegram.
# Скопируйте в config.toml и заполните.

[oscar]
# На каком адресе слушать. 0.0.0.0 — все интерфейсы.
host = "0.0.0.0"
port = 5190

# Учётка, которую вы вводите в Jimm на телефоне.
# UIN — от 5 до 6 цифр (Jimm не принимает совсем короткие номера).
# Чаты Telegram получают семизначные UIN, начиная с 1000001, так что
# номер владельца не должен доходить до миллиона.
uin = "100500"
password = "changeme"

# Адрес, который сервер сообщает клиенту для BOS-соединения.
# Должен быть виден с телефона (внешний IP или домен сервера).
# Если пусто — подставляется адрес, на который пришёл клиент.
# bos_port нужен, только если снаружи порт не такой, как port выше
# (например, проброс 443 -> 5190): тогда bos_port = 443.
bos_host = ""

# Кому разрешено подключаться. Пустой список — всем; можно перечислить
# адреса и подсети, например ["203.0.113.0/24", "198.51.100.7"].
allow_from = []

# Ограничения против перебора пароля и наплыва соединений.
max_connections = 8
login_attempts = 5
login_ban_seconds = 300

# Кодировка имён контактов и групп в контакт-листе.
# Jimm 0.7 ждёт cp1251 для кириллицы.
ssi_encoding = "cp1251"

[telegram]
# Ключи приложения: получите свои на https://my.telegram.org
# -> API development tools. Публичные ключи чужих клиентов лучше не брать:
# Telegram гасит созданные с ними сессии.
api_id = 0
api_hash = ""

# Чем клиент представляется серверу — должно соответствовать ключам выше.
device_model = "PC 64bit"
system_version = "Linux"
app_version = "4.16.8"
lang_code = "en"
session = "tg.session"

# Помечать чат прочитанным в Telegram после доставки на телефон.
mark_read = false

[bridge]
db = "bridge.db"

# folders — группы контактов берутся из папок Telegram;
# type    — группы «Личные / Группы / Каналы / Боты».
# Если папок в Telegram нет, folders автоматически ведёт себя как type.
grouping = "folders"

# Название группы для чатов, не попавших ни в одну папку.
other_group = "Прочее"

# Подставлять имя автора перед текстом в групповых чатах и каналах.
show_sender_in_groups = true

# Длинные сообщения режутся на куски по столько символов.
max_message_chars = 900

# Удаление контакта в клиенте удаляет чат и в Telegram: для групп и каналов
# это выход из них, для личной переписки — удаление истории у себя.
# Действие необратимое, поэтому его можно запретить.
allow_delete = true

# Пункт «Удалиться из его КЛ» удаляет переписку у обеих сторон. Это ещё
# заметнее для собеседника — при сомнениях выключите.
allow_delete_revoke = true

# Сколько чатов класть в контакт-лист телефона. 0 — все.
# Старые телефоны не тянут сотни контактов: Jimm держит список в памяти,
# и на 400+ чатах он может не загрузиться вовсе. Берутся самые свежие,
# избранные остаются всегда. Остальные чаты никуда не деваются: сообщения
# из них приходят, и их видно через поиск.
roster_limit = 0

# Названия длиннее этого обрезаются в контакт-листе.
alias_max_chars = 40

# Сколько тем брать из каждого форума. Каждая тема — отдельный контакт,
# а сам форум становится группой контакт-листа.
topics_limit = 50

# Аватарки контактов: телефон получает маленький квадратик и показывает его
# в списке и в карточке. Картинка тянется из Telegram по запросу, только для
# тех чатов, чью аватарку клиент действительно попросил. По умолчанию выключено:
# за картинками клиент ходит вторым соединением, а на старых телефонах и GPRS
# это лишний расход. Включайте, если хотите видеть лица в списке.
avatars = false
avatar_size = 64
avatar_max_kb = 4

# Избранные чаты — их сообщения приходят даже в тихих статусах,
# а в «недоступен» доходят только они.
# Закреплённые в Telegram чаты считаются избранными сами по себе; здесь
# можно дописать остальные по названию.
favourites = []

# Статус «занят»: групповые сообщения придерживаются и после смены статуса
# доставляются, если моложе стольких минут. У «не беспокоить» такого нет —
# там пропущенное не возвращается вовсе.
busy_hold_minutes = 30

# Предохранитель для команды !last: больше стольких сообщений она не выгрузит.
history_limit = 100

# Переводить эмодзи из Telegram в коды смайлов Jimm — тогда клиент рисует
# для них свои картинки, а не показывает квадраты.
emoji_to_text = true

# Переводить смайлы Jimm с телефона обратно в эмодзи: иначе собеседник
# увидит в Telegram "*IN_LOVE*" и "(y)" текстом.
text_to_emoji = true

# Сколько сообщений копить, пока телефон офлайн (на чат).
offline_queue_per_chat = 30

# Через столько секунд тишины телефон считается отключившимся, и сообщения
# идут в очередь, а не в зависший GPRS-сокет. Jimm шлёт keepalive каждые
# 120 секунд; 0 отключает проверку.
idle_timeout = 360

# При запуске догружать в очередь то, что пришло, пока мост не работал.
catch_up = true

# Слать сообщения расширенным форматом ICQ и ждать подтверждения получения
# от телефона. Запись уходит из очереди только после подтверждения.
# Если клиент подтверждений не шлёт, мост сам вернётся к обычным сообщениям.
delivery_ack = true
ack_timeout = 30

# Когда ставить галочку у отправленного с телефона сообщения:
#   read — когда собеседник его прочитал (по умолчанию)
#   sent — сразу после отправки в Telegram
ack_on = "read"

[photos]
# Команда !lastfoto: мост скачивает фото, ужимает под экран телефона и присылает
# ссылку на свой же мини-сервер. Порт нужно пробросить так же, как 5190.
enabled = true
host = "0.0.0.0"
port = 8080

# Адрес в ссылке. Если пусто — берётся oscar.bos_host.
public_host = ""

# Куда складывать перекодированные снимки и сколько часов их хранить.
dir = "photos"
keep_hours = 48

# Размер под экран телефона (по умолчанию как у Motorola V3) и потолок веса.
width = 176
height = 220
max_kb = 40

# Сколько фотографий отдавать за один запрос максимум.
per_request = 5

[render]
# Команда !render собирает последние сообщения чата в одну страницу для
# встроенного браузера телефона: текст, ужатые фото, видео в 3GP и голосовые
# в AMR. Раздаётся тем же мини-сервером, что и фотографии, поэтому работает
# только при включённой секции [photos].
enabled = true

# Куда складывать собранное и сколько минут живёт ссылка. По истечении срока
# страница и её вложения перестают отдаваться, а файлы удаляются.
dir = "render"
ttl_minutes = 30

# Потолок числа сообщений в одной странице.
messages = 20

# Чем перекодировать видео и звук. Нужен ffmpeg со сборкой h263 и
# libopencore_amrnb — без него текст и фото соберутся, а видео с голосовыми
# останутся пометками.
ffmpeg = "ffmpeg"

# Сколько секунд видео и звука брать и сколько ждать ffmpeg.
video_seconds = 60
audio_seconds = 300
timeout = 120

# Потолок веса исходного вложения: что больше — не качаем вовсе.
source_max_mb = 25

# Кодировка страницы. cp1251 — если браузер телефона не понял UTF-8.
encoding = "utf-8"
