# Конфигурация моста ICQ (OSCAR) <-> Telegram.
# Скопируйте в config.toml и заполните.

[oscar]
# На каком адресе слушать. 0.0.0.0 — все интерфейсы.
host = "0.0.0.0"
port = 5190

# Учётка, которую вы вводите в Jimm на телефоне.
# UIN — от 5 до 6 цифр (Jimm не принимает совсем короткие номера).
# Чаты Telegram получают семизначные UIN, начиная с 1000001, так что
# номер владельца не должен доходить до миллиона.
uin = "100500"
password = "changeme"

# Адрес, который сервер сообщает клиенту для BOS-соединения.
# Должен быть виден с телефона (внешний IP или домен сервера).
# Если пусто — подставляется адрес, на который пришёл клиент.
# bos_port нужен, только если снаружи порт не такой, как port выше
# (например, проброс 443 -> 5190): тогда bos_port = 443.
bos_host = ""

# Кому разрешено подключаться. Пустой список — всем; можно перечислить
# адреса и подсети, например ["203.0.113.0/24", "198.51.100.7"].
allow_from = []

# Ограничения против перебора пароля и наплыва соединений.
max_connections = 8
login_attempts = 5
login_ban_seconds = 300

# Кодировка имён контактов и групп в контакт-листе.
# Jimm 0.7 ждёт cp1251 для кириллицы.
ssi_encoding = "cp1251"

[telegram]
# Ключи приложения: получите свои на https://my.telegram.org
# -> API development tools. Публичные ключи чужих клиентов лучше не брать:
# Telegram гасит созданные с ними сессии.
api_id = 0
api_hash = ""

# Чем клиент представляется серверу — должно соответствовать ключам выше.
device_model = "PC 64bit"
system_version = "Linux"
app_version = "4.16.8"
lang_code = "en"
session = "tg.session"

# Помечать чат прочитанным в Telegram после доставки на телефон.
mark_read = false

[max]
# Вторая сеть — MAX (max.ru). Чаты MAX приходят на телефон в одной группе
# рядом с чатами Telegram; личные переписки, группы и каналы, сообщения в
# обе стороны, история (!last, !render, !lastfoto), «печатает» и статусы
# собеседников — как у Telegram. Заглушить чат MAX с телефона нельзя.
#
# Официального API для аккаунта у MAX нет: мост говорит с сервером через
# библиотеку maxapi-python тем же протоколом, что и приложение. Протокол
# могут сменить без предупреждения, а использование может нарушать условия
# сервиса — включайте на свой страх и риск.
#
# Вход один раз: python3 run.py login max (код из SMS).
enabled = false
phone = "+79990000000"
session = "max.session"

# Группа контакт-листа для чатов MAX.
group = "MAX"

# Сколько чатов MAX класть в контакт-лист: своё ограничение, отдельно от
# roster_limit в [bridge] (тот — для Telegram). 0 — все.
roster_limit = 0

# Класть ли в список и людей из адресной книги MAX, с которыми переписки
# ещё нет. Писать им можно сразу — первое сообщение заведёт чат.
contacts = true

[bridge]
db = "bridge.db"

# folders — группы контактов берутся из папок Telegram;
# type    — группы «Личные / Группы / Каналы / Боты».
# Если папок в Telegram нет, folders автоматически ведёт себя как type.
grouping = "folders"

# Название группы для чатов, не попавших ни в одну папку.
other_group = "Прочее"

# Куда складывать чаты из архива Telegram, если их не забрала своя папка.
# Пустая строка — раскладывать как обычные.
archive_group = "Архив"

# Показывать на телефоне и свои сообщения, написанные с других устройств
# (как «Я: …»). Отправленное с самого телефона обратно не возвращается.
mirror_outgoing = false

# Подставлять имя автора перед текстом в групповых чатах и каналах.
show_sender_in_groups = true

# Длинные сообщения режутся на куски по столько символов.
max_message_chars = 900

# Удаление контакта в клиенте удаляет чат и в Telegram: для групп и каналов
# это выход из них, для личной переписки — удаление истории у себя.
# Действие необратимое, поэтому его можно запретить.
allow_delete = true

# Пункт «Удалиться из его КЛ» удаляет переписку у обеих сторон. Это ещё
# заметнее для собеседника — при сомнениях выключите.
allow_delete_revoke = true

# Сколько чатов Telegram класть в контакт-лист телефона. 0 — все.
# (Для MAX — своё roster_limit в секции [max].)
# Старые телефоны не тянут сотни контактов: Jimm держит список в памяти,
# и на 400+ чатах он может не загрузиться вовсе. Берутся самые свежие,
# избранные остаются всегда. Остальные чаты никуда не деваются: сообщения
# из них приходят, и их видно через поиск.
roster_limit = 0

# Названия длиннее этого обрезаются в контакт-листе.
alias_max_chars = 40

# Сколько тем брать из каждого форума. Каждая тема — отдельный контакт,
# а сам форум становится группой контакт-листа.
topics_limit = 50

# Аватарки контактов: телефон получает маленький квадратик и показывает его
# в списке и в карточке. Картинка тянется из Telegram по запросу, только для
# тех чатов, чью аватарку клиент действительно попросил. По умолчанию выключено:
# за картинками клиент ходит вторым соединением, а на старых телефонах и GPRS
# это лишний расход. Включайте, если хотите видеть лица в списке.
avatars = false
avatar_size = 64
avatar_max_kb = 4

# Избранные чаты — их сообщения приходят даже в тихих статусах,
# а в «недоступен» доходят только они.
# Закреплённые в Telegram чаты считаются избранными сами по себе; здесь
# можно дописать остальные по названию.
favourites = []

# Фоновые группы (папки Telegram): при roster_limit их чаты претендуют на
# место в контакт-листе последними — попадают туда, только если после
# остальных осталось место. Чат из такой группы, писавший телефону за
# последние background_hours часов, идёт наравне со всеми (0 — не учитывать).
# Сообщения из отложенных чатов приходят как обычно.
background_groups = []
background_hours = 24

# Статус «занят»: групповые сообщения придерживаются и после смены статуса
# доставляются, если моложе стольких минут. У «не беспокоить» такого нет —
# там пропущенное не возвращается вовсе.
busy_hold_minutes = 30

# Предохранитель для команды !last: больше стольких сообщений она не выгрузит.
history_limit = 100

# Переводить эмодзи из Telegram в коды смайлов Jimm — тогда клиент рисует
# для них свои картинки, а не показывает квадраты.
emoji_to_text = true

# Переводить смайлы Jimm с телефона обратно в эмодзи: иначе собеседник
# увидит в Telegram "*IN_LOVE*" и "(y)" текстом.
text_to_emoji = true

# Сколько сообщений копить, пока телефон офлайн (на чат).
offline_queue_per_chat = 30

# Через столько секунд тишины телефон считается отключившимся, и сообщения
# идут в очередь, а не в зависший GPRS-сокет. Jimm шлёт keepalive каждые
# 120 секунд; 0 отключает проверку.
idle_timeout = 360

# При запуске догружать в очередь то, что пришло, пока мост не работал.
catch_up = true

# Слать сообщения расширенным форматом ICQ и ждать подтверждения получения
# от телефона. Запись уходит из очереди только после подтверждения.
# Если клиент подтверждений не шлёт, мост сам вернётся к обычным сообщениям.
delivery_ack = true

# «Прививка печатает»: после входа каждому контакту уходит «закончил набор»
# (04/14) — так штатная сборка Jimm «light» узнаёт, что контакту можно слать
# «печатает» (способности контактов она не разбирает). Сборке с модулем
# FILES (contrib/jimm) это не нужно; false экономит по 20 байт на контакт
# при входе.
typing_prime = true

# Telegram повторяет «печатает» каждые несколько секунд. Передавать телефону
# каждый повтор незачем, но и молчать нельзя: клиент гасит индикатор сам,
# секунд через десять. Поэтому повторяем не чаще, чем раз во столько секунд;
# 0 — совсем не повторять (индикатор мелькнёт и погаснет). Звук на телефоне
# при этом играет только в начале набора — за это отвечает уже клиент.
typing_repeat = 10

ack_timeout = 30

# Когда ставить галочку у отправленного с телефона сообщения:
#   read — когда собеседник его прочитал (по умолчанию)
#   sent — сразу после отправки в Telegram
ack_on = "read"

[photos]
# Команда !lastfoto: мост скачивает фото, ужимает под экран телефона и присылает
# ссылку на свой же мини-сервер. Порт нужно пробросить так же, как 5190.
enabled = true
host = "0.0.0.0"
port = 8080

# Адрес в ссылке. Если пусто — берётся oscar.bos_host.
public_host = ""
# Или сразу весь адрес сервера, если он за доменом или другим портом:
# public_url = "http://phone.example.org"
public_url = ""

# Пароль на страницы и снимки. Пусто — без пароля. Проверяется тремя
# способами, потому что браузер старого телефона может не уметь какой-то
# из них: окно HTTP Basic, форма входа (cookie на месяц) и ключ прямо в
# адресе: http://…/r/3?key=пароль — его удобно набирать на кнопках.
password = ""

# Класть ли в ссылки, которые мост шлёт телефону (!render, !lastfoto), токен
# сеанса — чтобы по ним входить без пароля. Сам пароль в ссылку не попадает.
link_session = true

# Куда складывать перекодированные снимки и сколько часов их хранить.
dir = "photos"
keep_hours = 48

# Размер под экран телефона (по умолчанию как у Motorola V3) и потолок веса.
width = 176
height = 220
max_kb = 40

# Сколько фотографий отдавать за один запрос максимум.
per_request = 5

[render]
# Команда !render собирает последние сообщения чата в одну страницу для
# встроенного браузера телефона: текст, ужатые фото, видео в 3GP и голосовые
# в AMR. Раздаётся тем же мини-сервером, что и фотографии, поэтому работает
# только при включённой секции [photos].
enabled = true

# Куда складывать собранное и сколько минут живёт ссылка. По истечении срока
# страница и её вложения перестают отдаваться, а файлы удаляются.
dir = "render"
ttl_minutes = 30

# Потолок числа сообщений в одной странице.
messages = 20

# Чем перекодировать видео и звук. Нужен ffmpeg со сборкой h263 и
# libopencore_amrnb — без него текст и фото соберутся, а видео с голосовыми
# останутся пометками.
ffmpeg = "ffmpeg"

# Сколько секунд видео и звука брать и сколько ждать ffmpeg.
video_seconds = 60
audio_seconds = 300
timeout = 120

# Кодек видео: h263 (Baseline Level 10) или mpeg4 (Simple Profile Level 0) —
# плеер RAZR V3 умеет оба, но только в пределах уровня: 176x144, не больше
# 15 кадров в секунду и 64 кбит/с. Если ролики не открываются с одним
# кодеком — попробуйте другой; поднимать битрейт выше 64 не стоит.
video_codec = "h263"
video_kbps = 64
video_fps = 15

# Потолок веса исходного вложения: что больше — не качаем вовсе.
source_max_mb = 25

# Кодировка страницы. cp1251 — если браузер телефона не понял UTF-8.
encoding = "utf-8"

# Адрес страницы. {n} — сквозной номер (1, 2, 3…), {chat} — название чата
# латиницей, {token} — случайная строка. Номер короткий и набирается с
# телефона; поставьте пароль в [photos], если сервер смотрит в интернет.
path = "/r/{n}"

# Список собранных страниц по адресу /r/ — чтобы не набирать адреса руками.
index = false

# Потолок одной страницы в килобайтах: браузер телефона и WAP-шлюз за ним
# отвергают ответы больше своего предела (у Openwave на V3 — около 10 КБ,
# шлюз показывает «413»). Что не влезло, уходит на следующую часть со
# ссылками «назад / далее». 0 — не резать.
page_max_kb = 6


[downloads]
# Раздел «Загрузки» на мини-сервере: файлы из этого каталога отдаются по
# адресу /d/<имя>, а /d/ показывает их список. Удобно для jad/jar (Jimm на
# телефон ставится именно так), картинок, мелодий. Только файлы из самого
# каталога, без подкаталогов и скрытых. Пусто — раздела нет.
dir = ""

# Закрывать ли раздел паролем из [photos]. По умолчанию нет: JAR по ссылке из
# JAD качает не браузер, а установщик телефона, и пароля он спросить не умеет.
protected = false

[assistant]
# Контакт «Claude» в контакт-листе: всё, что ему пишете с телефона, уходит
# в Claude Code (`claude -p`) под тем пользователем, от которого работает
# мост, — то есть по его подписке и с его настройками. Ответ приходит от
# контакта; пока он готовится — «печатает». Следующий вопрос продолжает
# разговор, !reset начинает его заново.
#
# Нужен установленный Claude Code и вход под пользователем моста:
#   su -s /bin/sh icqbridge -c 'claude -p "ответь одним словом: работает?"'
enabled = false

# Программа и её рабочий каталог: в нём claude держит сеансы разговора
# (в ~/.claude по пути каталога), и оттуда же он возьмёт CLAUDE.md, если
# захотите дать контакту постоянные указания.
command = "claude"
workdir = "claude"

# Модель и усилие. Пусто — как настроено в самом Claude Code; low — быстро
# и обычно достаточно для переписки с телефона.
model = ""
effort = "low"

# Подсказка модели вдобавок к штатной. Пусто — встроенная: отвечать
# по-русски, коротко, без разметки, под экран 176x220.
system = ""

# Инструменты, которые контакту разрешены без вопросов (в режиме печати
# спросить некого — что не разрешено, то отклоняется). По умолчанию только
# сеть; "" — совсем без инструментов; "default" — все, но тогда разрешения
# берутся из настроек Claude Code (~/.claude/settings.json).
tools = "WebSearch,WebFetch"

# Любые другие аргументы `claude`, одной строкой — например
# "--max-turns 5" или "--permission-mode bypassPermissions".
args = ""

# Сколько секунд ждать ответа (с поиском в сети бывает и минута-другая)
# и через сколько часов тишины начинать новый разговор (0 — не начинать).
timeout = 300
session_hours = 0

# Как контакт выглядит в списке.
title = "Claude"
group = "Боты"

[telemotomax]
# Свой клиент TeleMotoMax (каталог telemotomax/) получает от моста снимки из
# сообщений прямо в чат — по запросу, через ту же службу, что и аватарки.
# Размер и потолок веса снимка; обычного Jimm это не касается.
photo_width = 176
photo_height = 176
photo_max_kb = 20

# Сколько первых секунд ролика отдавать по «Смотреть видео». Ролик качается
# и перекодируется только по запросу — тем же ffmpeg, с кодеком и битрейтом
# из [render] (video_codec, video_kbps, video_fps). 10 с при 64 кбит/с —
# около 100 КБ, на GPRS это с минуту. 0 — видео выключить (останется превью).
video_seconds = 10

# Потолок длительности голосового (секунды) — и того, что мост отдаёт
# телефону по «Прослушать» (AMR в 3GP, ~1 КБ в секунду), и того, что
# телефон записал сам: длиннее просто обрежется при перекодировании.
# Сам телефон в любом случае останавливает запись на 60 с и на 512 КБ.
voice_seconds = 60

# Сколько всего сообщений можно пролистать в «Истории с сервера»: экран
# берёт их пачками по «Ещё», и это потолок на всю переписку за один заход.
history_max = 200

[log]
# Уровень журнала: DEBUG — каждый SNAC и сами тексты сообщений; INFO —
# события без текста (кто подключился, что ушло и пришло, что и почему
# отсеяно); WARNING — то, что мост пережил сам; ERROR — чего быть не должно.
# Переменная окружения BRIDGE_LOGLEVEL сильнее этой настройки: под OpenRC её
# задаёт bridge_loglevel в /etc/conf.d/icq-tg-bridge, если там не пусто.
level = "INFO"
telethon_level = "WARNING"
# И записей библиотеки MAX (pymax).
max_level = "WARNING"

# Писать ли на INFO строки «не доставляю (заглушён в Telegram)» и «придержано»
# — по одной на каждое отсеянное сообщение. В шумных заглушённых каналах их
# много; false опускает их до DEBUG.
filtered = true

# Писать журнал ещё и в файл (с ротацией). Пусто — только на консоль. Под
# службой консоль и так уходит в /var/log/icq-tg-bridge.log (OpenRC) или в
# journald (systemd), так что файл тут нужен редко.
file = ""
file_max_mb = 5
file_keep = 3
